{% load i18n %}
<td class="row-actions">
  {% if row.edit_url %}
    <a href="{{ row.edit_url }}" class="act-btn" title="{% trans 'Tahrirlash' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </a>
  {% endif %}
  {% if row.del_url %}
    <button type="button" class="act-btn act-del" title="{% trans 'O‘chirish' %}" data-del="{{ row.del_url }}" onclick="confirmDelete(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  {% endif %}
  {% if not row.edit_url and not row.del_url %}
    <span class="act-lock" title="{% trans '24 soat muddati tugagan' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </span>
  {% endif %}
</td>
